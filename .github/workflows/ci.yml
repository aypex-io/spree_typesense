name: CI
on: [push, pull_request]

# The specs are the only code this workflow runs, and they can be written by
# anyone who opens a PR, including automated agents. Give them a read-only token.
permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The gemspec claims spree_core >= 5.5, < 6.1 — test each minor in it.
        # 5.5.x documents carry no `preorder` field, which is why the schema
        # declares it optional; 5.6.x adds it and `cf_*` metafield keys.
        # 6.0 ships no core presenter and renames the document's sources
        # (categories, `label`, custom fields), so it gets its own legs: the
        # first 6.0 release and the latest patch.
        spree_core: ['5.5.1', '5.6.1', '6.0.0', '6.0.1']
    name: spec (spree_core ${{ matrix.spree_core }})
    services:
      typesense:
        # Pinned to a full MAJOR.MINOR.PATCH — never a floating tag. A floating
        # minor tag is what broke the Meilisearch deployment this gem replaces.
        image: typesense/typesense:30.2
        ports: ['8108:8108']
        # Typesense refuses to start if its data dir does not already exist, and
        # a `services:` container cannot mkdir beforehand. Bind-mounting a host
        # path makes Docker create it.
        volumes:
          - /tmp/typesense-ci-data:/data
        env:
          TYPESENSE_API_KEY: test-key
          TYPESENSE_DATA_DIR: /data
        # NOTE: deliberately no --health-cmd. A service healthcheck runs INSIDE
        # the container, and the Typesense image ships no curl/wget, so any such
        # probe fails forever and the job dies at container init. We wait from
        # the runner instead, which has curl.
    env:
      TYPESENSE_URL: http://localhost:8108
      TYPESENSE_API_KEY: test-key
      SPREE_CORE_VERSION: ${{ matrix.spree_core }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config, where the specs could read it.
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          # No Gemfile.lock is committed, so the bundler cache key derives from
          # the Gemfile/gemspec — identical across matrix legs. Without this,
          # the 5.6.1 leg would restore the 5.5.1 leg's gems and silently test
          # the same version twice, making the matrix decorative.
          cache-version: spree-core-${{ matrix.spree_core }}

      - name: Wait for Typesense
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$TYPESENSE_URL/health" >/dev/null 2>&1; then
              echo "Typesense ready after ${i}s"
              curl -sS "$TYPESENSE_URL/health"; echo
              exit 0
            fi
            sleep 1
          done
          echo "Typesense did not become ready in 30s" >&2
          docker ps -a >&2
          exit 1

      - name: Run specs
        run: bundle exec rspec
